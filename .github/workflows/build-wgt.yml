name: Build Tizen 6.0 WGT

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/build-wgt.sh'
      - '.github/workflows/build-wgt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned Tizen package
        run: bash scripts/build-wgt.sh

      - name: Validate package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, xml.etree.ElementTree as ET
          package = Path('build/samsucks-tizen6-unsigned.wgt')
          assert package.exists() and package.stat().st_size > 0
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None, 'Corrupt WGT archive'
              entries = set(archive.namelist())
              assert {'config.xml', 'index.html', 'icon.png', 'js/main.js', 'js/config.js'} <= entries
              assert not any(name.startswith('js/dev/') for name in entries)
              config = ET.fromstring(archive.read('config.xml'))
              app = config.find('{http://tizen.org/ns/widgets}application')
              assert app is not None and app.attrib['required_version'] == '6.0'
              assert b'modulepreload' in archive.read('index.html')
          print(f'Validated {package}: {package.stat().st_size} bytes')
          PY

      - name: Upload unsigned WGT
        uses: actions/upload-artifact@v4
        with:
          name: samsucks-tizen6-unsigned-wgt
          path: build/samsucks-tizen6-unsigned.wgt
          if-no-files-found: error
          retention-days: 30
