name: Build Tizen 6.0 WGT

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/build-wgt.sh'
      - 'tests/**'
      - '.github/workflows/build-wgt.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tool
        run: npm install --no-save --ignore-scripts esbuild@0.25.12

      - name: Check connection and playback logic
        run: |
          node --experimental-default-type=module tests/network-playback.mjs
          node --experimental-default-type=module tests/audio-playback.mjs
          node --experimental-default-type=module tests/preplay-options.mjs
          node --experimental-default-type=module tests/subtitle-stability.mjs

      - name: Build unsigned Tizen package
        run: bash scripts/build-wgt.sh

      - name: Validate package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, xml.etree.ElementTree as ET
          package = Path('build/samsucks-tizen6-unsigned.wgt')
          assert package.exists() and package.stat().st_size > 0
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None, 'Corrupt WGT archive'
              entries = set(archive.namelist())
              assert {'config.xml', 'index.html', 'icon.png', 'js/bundle.js'} <= entries
              assert not any(name.startswith('js/dev/') for name in entries)
              config = ET.fromstring(archive.read('config.xml'))
              app = config.find('{http://tizen.org/ns/widgets}application')
              assert app is not None and app.attrib['required_version'] == '6.0'
              html = archive.read('index.html')
              assert b'js/bundle.js' in html and b'type="module"' not in html
              assert len(archive.read('js/bundle.js')) > 10000
          print(f'Validated {package}: {package.stat().st_size} bytes')
          PY

      - name: Upload unsigned WGT
        uses: actions/upload-artifact@v4
        with:
          name: samsucks-tizen6-unsigned-wgt
          path: build/samsucks-tizen6-unsigned.wgt
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable WGT release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tizen6-build-${GITHUB_RUN_NUMBER}" \
            "build/samsucks-tizen6-unsigned.wgt" \
            --target "${GITHUB_SHA}" \
            --title "SamSUCKS Tizen 6.0 - Build ${GITHUB_RUN_NUMBER}" \
            --notes "v0.1.7 Tizen 6.0: stabilizes subtitle preparation and HLS switching, prevents simultaneous PGS transcodes, avoids forced 4K mode for transcoded HLS, and reduces menu rendering. The README includes a ChatGPT-modified warning; original author credits retained. Native TV playback remains unverified." \
            --latest
